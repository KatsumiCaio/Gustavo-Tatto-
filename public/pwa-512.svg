<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Soft Cream Tint -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#FFF4F4" />
      <stop offset="70%" stop-color="#FDEAEA" />
      <stop offset="100%" stop-color="#F8DFDF" />
    </radialGradient>

    <!-- Fiery Gradient for Gustavo Tattoo Script (Yellow -> Orange -> Red -> Crimson) -->
    <linearGradient id="fireScript" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="20%" stop-color="#FF9A00" />
      <stop offset="45%" stop-color="#FF4D00" />
      <stop offset="75%" stop-color="#E60000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Fiery Outline/Stroke Gradient -->
    <linearGradient id="fireStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF000" />
      <stop offset="35%" stop-color="#FF7700" />
      <stop offset="70%" stop-color="#FF1A00" />
      <stop offset="100%" stop-color="#B30000" />
    </linearGradient>

    <!-- Red Border for Black Sticker -->
    <linearGradient id="redBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E00" />
      <stop offset="50%" stop-color="#E60000" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>

    <!-- Drop Shadow for the sticker on canvas -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="8" stdDeviation="12" flood-color="#2B0000" flood-opacity="0.15" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Alex+Brush&amp;family=Montserrat:wght@700&amp;display=swap');
      
      .text-gustavo {
        font-family: 'Great Vibes', 'Alex Brush', cursive;
        font-size: 170px;
        font-weight: 700;
        fill: url(#fireScript);
      }
      
      .text-tattoo {
        font-family: 'Great Vibes', 'Alex Brush', cursive;
        font-size: 195px;
        font-weight: 700;
        fill: url(#fireScript);
      }

      .text-insta {
        font-family: 'Montserrat', sans-serif;
        font-size: 21px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)" />

  <g transform="translate(512, 480)" filter="url(#stickerShadow)">
    <!-- STICKER BASE LAYER 1: Red Outline Boundary Path -->
    <path d="
      M -340 -340
      C -220 -400, 20 -410, 240 -380
      C 370 -360, 440 -270, 430 -160
      C 420 -80, 450 0, 430 80
      C 410 160, 440 230, 360 310
      C 270 390, 80 430, -90 410
      C -220 390, -360 360, -420 260
      C -470 180, -430 90, -420 -10
      C -410 -110, -460 -210, -390 -290
      C -370 -310, -355 -325, -340 -340 Z
    " fill="none" stroke="url(#redBorder)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" />

    <!-- STICKER BASE LAYER 2: Solid Black Cloud Background -->
    <path d="
      M -340 -340
      C -220 -400, 20 -410, 240 -380
      C 370 -360, 440 -270, 430 -160
      C 420 -80, 450 0, 430 80
      C 410 160, 440 230, 360 310
      C 270 390, 80 430, -90 410
      C -220 390, -360 360, -420 260
      C -470 180, -430 90, -420 -10
      C -410 -110, -460 -210, -390 -290
      C -370 -310, -355 -325, -340 -340 Z
    " fill="#080808" />

    <!-- CALLIGRAPHIC ARTWORK: Gustavo -->
    <g transform="translate(0, -110)">
      <!-- Outer Flame Glow & Stroke around Gustavo -->
      <path d="M -340 -70 C -380 -180, -220 -230, -100 -200 Q 120 -170, 320 -230 C 370 -200, 320 -150, 220 -160" 
            fill="none" stroke="url(#fireStroke)" stroke-width="16" stroke-linecap="round" />

      <path d="M -330 -10 Q -380 90, -260 140 C -180 170, -120 100, -170 10 C -200 -50, -300 -30, -330 -10 Z" 
            fill="url(#fireScript)" />

      <!-- Main Script Text Gustavo -->
      <text x="10" y="20" text-anchor="middle" className="text-gustavo">
        Gustavo
      </text>
    </g>

    <!-- CALLIGRAPHIC ARTWORK: Tattoo -->
    <g transform="translate(0, 100)">
      <!-- High Sweeping T Bar -->
      <path d="M -360 -130 Q -180 -190, 10 -150 Q 200 -110, 380 -160 C 410 -130, 370 -90, 240 -100 Q 50 -110, -200 -120" 
            fill="none" stroke="url(#fireStroke)" stroke-width="18" stroke-linecap="round" />

      <!-- Main Script Text Tattoo -->
      <text x="20" y="30" text-anchor="middle" className="text-tattoo">
        Tattoo
      </text>

      <!-- Bottom Underline Swash Ribbon -->
      <path d="M -260 80 Q -120 180, 100 140 Q 280 100, 340 170 C 370 210, 310 240, 210 200 Q 50 140, -160 160 Q -240 170, -260 80 Z" 
            fill="url(#fireScript)" />
    </g>

    <!-- INSTAGRAM PILL BADGE AT BOTTOM LEFT -->
    <g transform="translate(-235, 275) rotate(-11)">
      <!-- Badge Body -->
      <rect x="-20" y="-22" width="280" height="44" rx="22" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="2.5" />
      
      <!-- Instagram Camera Icon -->
      <g transform="translate(0, -12) scale(0.85)">
        <rect x="0" y="0" width="26" height="26" rx="7.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
        <circle cx="13" cy="13" r="6" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
        <circle cx="19.5" cy="6.5" r="1.8" fill="#FFFFFF" />
      </g>

      <!-- Text handle -->
      <text x="34" y="7" className="text-insta">
        gustavotomaz_tattoo
      </text>
    </g>
  </g>
</svg>