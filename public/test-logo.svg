<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Fiery Gradient for Lettering -->
    <linearGradient id="fireGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFF000" />
      <stop offset="25%" stop-color="#FF9000" />
      <stop offset="55%" stop-color="#FF3600" />
      <stop offset="85%" stop-color="#D00000" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>

    <!-- Red Border for Sticker -->
    <linearGradient id="redBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A00" />
      <stop offset="50%" stop-color="#E60000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Font imports / styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Monsieur+La+Doulaise&amp;family=UnifrakturMaguntia&amp;family=Arizonia&amp;display=swap');
      
      .tattoo-gustavo {
        font-family: 'Great Vibes', 'Monsieur La Doulaise', cursive;
        font-size: 155px;
        font-weight: 700;
        fill: url(#fireGrad);
      }
      .tattoo-tattoo {
        font-family: 'Great Vibes', 'Monsieur La Doulaise', cursive;
        font-size: 165px;
        font-weight: 700;
        fill: url(#fireGrad);
      }
      .insta-text {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #FFFFFF;
      }
    </style>
  </defs>

  <!-- Background Canvas (Soft Off-White / Pale Cream) -->
  <rect width="1000" height="1000" fill="#FFF3F3" />

  <g transform="translate(500, 470)">
    <!-- STICKER BASE: Outer Red Contour Layer -->
    <path d="
      M -360 -280
      C -260 -360, -100 -370, 80 -360
      C 220 -350, 380 -320, 420 -230
      C 460 -150, 420 -60, 440 30
      C 460 120, 410 220, 310 280
      C 210 340, 50 380, -90 350
      C -220 320, -320 280, -380 180
      C -430 90, -420 -30, -440 -120
      C -460 -200, -420 -240, -360 -280 Z
    " fill="#0A0A0A" stroke="url(#redBorderGrad)" stroke-width="12" stroke-linejoin="round" />

    <!-- Detailed Sticker Silhouette (Black Body) -->
    <!-- Custom Calligraphic Lettering Paths / Rendered Text -->
    
    <!-- Top Word: Gustavo -->
    <g transform="translate(0, -90)">
      <!-- Calligraphic Flourishes and Swashes -->
      <!-- Top G Loop Swash -->
      <path d="M -320 -110 Q -240 -180, -100 -140 Q 50 -100, 220 -150 Q 310 -170, 340 -130 Q 360 -100, 320 -80 Q 250 -50, 120 -80" 
            fill="none" stroke="url(#fireGrad)" stroke-width="16" stroke-linecap="round" />
      
      <!-- G Letter Main Curve -->
      <path d="M -280 -140 C -380 -100, -400 30, -300 110 C -220 170, -140 120, -180 30 C -210 -30, -300 -40, -280 -140 Z" 
            fill="url(#fireGrad)" />

      <!-- Text Gustavo Calligraphy -->
      <text x="-80" y="20" text-anchor="middle" className="tattoo-gustavo">
        Gustavo
      </text>
    </g>

    <!-- Bottom Word: Tattoo -->
    <g transform="translate(0, 110)">
      <!-- Large Sweeping T Crossbar -->
      <path d="M -340 -120 Q -200 -160, -20 -130 Q 180 -100, 360 -140 Q 390 -110, 350 -80 Q 220 -40, 50 -70" 
            fill="none" stroke="url(#fireGrad)" stroke-width="18" stroke-linecap="round" />

      <text x="0" y="30" text-anchor="middle" className="tattoo-tattoo">
        Tattoo
      </text>

      <!-- Bottom Swash Flourish -->
      <path d="M -240 70 Q -100 160, 100 130 Q 260 100, 320 150 Q 350 180, 300 200 Q 200 220, 50 150 Q -120 100, -200 140" 
            fill="none" stroke="url(#fireGrad)" stroke-width="16" stroke-linecap="round" />
    </g>

    <!-- Bottom Left Instagram Badge -->
    <g transform="translate(-250, 260) rotate(-8)">
      <!-- Badge Pill background -->
      <rect x="-15" y="-22" width="270" height="44" rx="22" fill="#000000" stroke="#FFFFFF" stroke-width="2.5" />
      
      <!-- Instagram Camera Icon -->
      <g transform="translate(5, -12) scale(0.85)">
        <rect x="0" y="0" width="26" height="26" rx="7" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
        <circle cx="13" cy="13" r="6" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
        <circle cx="19.5" cy="6.5" r="1.5" fill="#FFFFFF" />
      </g>

      <!-- Handle text -->
      <text x="38" y="7" className="insta-text">
        gustavotomaz_tattoo
      </text>
    </g>
  </g>
</svg>